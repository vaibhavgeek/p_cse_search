<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reel & TikTok Search</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0 auto;
      padding: 24px;
      max-width: 900px;
      color: #1a1a1a;
      background: #fafafa;
    }
    h1 { font-size: 20px; margin: 0 0 16px; }

    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 2px solid #e5e5e5;
      margin-bottom: 20px;
    }
    .tab {
      background: none;
      border: none;
      padding: 10px 18px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      color: #666;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab:hover { color: #1a1a1a; }
    .tab.active { color: #1a1a1a; border-bottom-color: #1a1a1a; }

    #search-mount { min-height: 200px; }

    /* ── Google CSE widget overrides ────────────────────────────── */

    /* Hide Google branding */
    .gsc-branding,
    .gcsc-branding,
    .gsc-completion-container img[src*="branding"],
    .gsc-adBlock,
    .gsc-above-wrapper-area-container .gsc-result-info,
    .gsc-tabsAreaInvisible + .gsc-refinementsAreaInvisible { display: none !important; }

    /* Clean search box */
    .gsc-input-box {
      border: 1px solid #d1d5db !important;
      border-radius: 10px !important;
      box-shadow: none !important;
      padding: 6px 10px !important;
      background: #fff !important;
    }
    .gsc-input-box:focus-within {
      border-color: #6366f1 !important;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15) !important;
    }
    input.gsc-input {
      background-image: none !important;
      font-size: 15px !important;
    }
    .gsc-search-button-v2 {
      background: #1a1a1a !important;
      border: 1px solid #1a1a1a !important;
      border-radius: 10px !important;
      padding: 10px 16px !important;
      margin-left: 6px !important;
    }
    .gsc-search-button-v2:hover { background: #000 !important; }
    .gsc-search-button-v2 svg { fill: #fff !important; }

    /* Result cards */
    .gsc-webResult.gsc-result {
      border: 1px solid #e5e7eb !important;
      border-radius: 12px !important;
      background: #fff !important;
      padding: 16px !important;
      margin-bottom: 12px !important;
      position: relative !important;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .gsc-webResult.gsc-result:hover {
      border-color: #c7d2fe !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    .gsc-webResult.gsc-result:not(:last-child) { border-bottom: 1px solid #e5e7eb !important; }
    .gs-title { text-decoration: none !important; }
    .gs-title b { color: #4f46e5 !important; }

    /* Injected download button */
    .reel-download-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      z-index: 5;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 1px 3px rgba(79, 70, 229, 0.3);
    }
    .reel-download-btn:hover { background: #4338ca; transform: translateY(-1px); }
    .reel-download-btn:active { transform: translateY(0); }
    .reel-download-btn:disabled { opacity: 0.7; cursor: wait; }

    /* Extract JSON button — sits next to Copy link */
    .reel-extract-btn {
      position: absolute;
      top: 12px;
      right: 116px; /* leave room for Copy link (~96px + gap) */
      background: #059669;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      z-index: 5;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 1px 3px rgba(5, 150, 105, 0.3);
    }
    .reel-extract-btn:hover { background: #047857; transform: translateY(-1px); }
    .reel-extract-btn:active { transform: translateY(0); }
    .reel-extract-btn:disabled { opacity: 0.7; cursor: wait; }

    /* JSON output panel */
    .reel-json-panel {
      margin-top: 12px;
      padding: 12px;
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      line-height: 1.5;
      overflow-x: auto;
      white-space: pre;
      border: 1px solid #1e293b;
    }
    .reel-json-panel .k { color: #93c5fd; }
    .reel-json-panel .s { color: #86efac; }
    .reel-json-panel .n { color: #fca5a5; }
    .reel-json-panel .err { color: #fca5a5; }

    /* API-key setup banner */
    .api-key-banner {
      background: #fef3c7;
      border: 1px solid #fcd34d;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
    }
    .api-key-banner input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .api-key-banner button {
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .api-key-banner.ok { background: #d1fae5; border-color: #6ee7b7; }
    .api-key-banner a { color: #4f46e5; }

    /* Pagination */
    .gsc-cursor-page {
      border: 1px solid #e5e7eb !important;
      border-radius: 6px !important;
      padding: 6px 10px !important;
      margin: 0 2px !important;
      color: #4f46e5 !important;
      text-decoration: none !important;
    }
    .gsc-cursor-current-page {
      background: #4f46e5 !important;
      color: #fff !important;
      border-color: #4f46e5 !important;
    }
  </style>
</head>
<body>
  <h1>Search</h1>

  <div id="api-key-banner" class="api-key-banner" hidden>
    <span id="api-key-msg">🔑 Paste your OpenAI API key to enable the "Extract JSON" button.
      <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener noreferrer">Get one here</a>.
      Stored only in your browser (localStorage).
    </span>
    <input id="api-key-input" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false">
    <button id="api-key-save" type="button">Save</button>
    <button id="api-key-clear" type="button" hidden>Clear</button>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab active" data-cx="013354601007441521110:enwkzivtj-o" role="tab">Instagram Reels</button>
    <button class="tab" data-cx="261ccab135254441d" role="tab">TikTok</button>
  </div>
  <div id="search-mount"></div>

  <script>
    (function () {
      var mount = document.getElementById('search-mount');
      var tabs = document.querySelectorAll('.tab');
      var loadedCx = {};

      function render(cx) {
        // Clear previous element
        mount.innerHTML = '';
        var el = document.createElement('div');
        el.className = 'gcse-search';
        mount.appendChild(el);

        if (loadedCx[cx]) {
          // Script for this cx already loaded — just re-render
          if (window.google && google.search && google.search.cse && google.search.cse.element) {
            google.search.cse.element.render({ div: el, tag: 'search' });
          }
          return;
        }

        // First time we see this cx: load its cse.js
        loadedCx[cx] = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://cse.google.com/cse.js?cx=' + encodeURIComponent(cx);
        document.head.appendChild(s);
      }

      tabs.forEach(function (t) {
        t.addEventListener('click', function () {
          tabs.forEach(function (x) { x.classList.remove('active'); });
          t.classList.add('active');
          render(t.getAttribute('data-cx'));
        });
      });

      // Initial render: first tab
      render(tabs[0].getAttribute('data-cx'));
    })();
  </script>

  <script>
    // Inject a "Download" button into every search result (SaveMyReels trick).
    // Google's CSE widget renders results asynchronously into the DOM, so we
    // watch the whole body and add the button as soon as a result appears.
    (function () {
      var SVG_DOWNLOAD =
        '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';

      function copy(text, btn) {
        var original = btn.innerHTML;
        var flash = function (label) {
          btn.innerHTML = label;
          setTimeout(function () { btn.innerHTML = original; }, 1400);
        };

        // Try the sync execCommand path first — works without a permission
        // prompt as long as we're inside a user-gesture handler (we are:
        // this runs from a click listener).
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '0';
        ta.style.left = '0';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        document.body.removeChild(ta);

        if (ok) { flash('✓ Copied'); return; }

        // Fallback to the async Clipboard API (may prompt).
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(
            function () { flash('✓ Copied'); },
            function () { flash('✗ Copy failed'); }
          );
        } else {
          flash('✗ Copy failed');
        }
      }

      function addButtons() {
        var results = document.querySelectorAll('.gsc-webResult.gsc-result');
        results.forEach(function (result) {
          if (result.querySelector('.reel-download-btn')) return; // already added

          var link = result.querySelector('a.gs-title[href], a[data-ctorig]');
          if (!link) return;

          // Google mangles the outbound link with click-tracking. data-ctorig
          // holds the true destination.
          var url = link.getAttribute('data-ctorig') || link.href;
          if (!url) return;

          var btn = document.createElement('button');
          btn.className = 'reel-download-btn';
          btn.type = 'button';
          btn.innerHTML = SVG_DOWNLOAD + '<span>Copy link</span>';
          btn.title = url;

          btn.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            copy(url, btn);
          });

          result.appendChild(btn);
        });

        // Also strip the Google branding row inside the autocomplete dropdown.
        document.querySelectorAll('.gsc-completion-container img[src*="branding"]')
          .forEach(function (img) {
            var row = img.closest('tr');
            if (row) row.style.display = 'none';
          });

        // Open results in a new tab.
        document.querySelectorAll('.gs-title[href]').forEach(function (a) {
          if (a.getAttribute('target') !== '_blank') {
            a.setAttribute('target', '_blank');
            a.setAttribute('rel', 'noopener noreferrer');
          }
        });
      }

      var mo = new MutationObserver(addButtons);
      mo.observe(document.body, { childList: true, subtree: true });
    })();
  </script>

  <script>
    // API key management: stored in localStorage, banner UI to set/clear.
    (function () {
      var KEY_STORAGE = 'openai_api_key';
      var banner = document.getElementById('api-key-banner');
      var msg = document.getElementById('api-key-msg');
      var input = document.getElementById('api-key-input');
      var saveBtn = document.getElementById('api-key-save');
      var clearBtn = document.getElementById('api-key-clear');

      window.getApiKey = function () {
        try { return localStorage.getItem(KEY_STORAGE) || ''; }
        catch (e) { return ''; }
      };

      function render() {
        var key = window.getApiKey();
        banner.hidden = false;
        if (key) {
          banner.classList.add('ok');
          msg.innerHTML = '✓ OpenAI key saved (' +
            key.slice(0, 7) + '…' + key.slice(-4) +
            '). Click "Extract JSON" on any result.';
          input.hidden = true;
          saveBtn.hidden = true;
          clearBtn.hidden = false;
        } else {
          banner.classList.remove('ok');
          msg.innerHTML = '🔑 Paste your OpenAI API key to enable "Extract JSON". ' +
            '<a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener noreferrer">Get one</a>. ' +
            'Stored only in your browser.';
          input.hidden = false;
          saveBtn.hidden = false;
          clearBtn.hidden = true;
        }
      }

      saveBtn.addEventListener('click', function () {
        var v = (input.value || '').trim();
        if (!v.startsWith('sk-')) {
          input.style.borderColor = '#e11d48';
          input.placeholder = 'Must start with sk-...';
          input.value = '';
          return;
        }
        try { localStorage.setItem(KEY_STORAGE, v); } catch (e) {}
        input.value = '';
        render();
      });

      clearBtn.addEventListener('click', function () {
        try { localStorage.removeItem(KEY_STORAGE); } catch (e) {}
        render();
      });

      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') saveBtn.click();
      });

      render();
    })();
  </script>

  <script>
    // LLM extraction: on-click, send the result card's text to OpenAI and
    // render a JSON badge under the card.
    //
    // Token-cost strategy (gpt-4o-mini: $0.15/1M in, $0.60/1M out):
    //   1. Extract url/username/shortcode client-side via regex (0 tokens).
    //      Only send the snippet to the LLM.
    //   2. Truncate snippet to 300 chars.
    //   3. Terse one-line system prompt.
    //   4. Cap output at 200 tokens.
    //   5. Cache extractions in localStorage keyed by URL — re-click is free.
    (function () {
      var SVG_SPARK =
        '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>';
      var CACHE_KEY = 'reel_extract_cache_v1';
      var SNIPPET_MAX = 300;

      function loadCache() {
        try { return JSON.parse(localStorage.getItem(CACHE_KEY) || '{}'); }
        catch (e) { return {}; }
      }
      function saveCache(obj) {
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(obj)); } catch (e) {}
      }

      // Regex-extract everything we can WITHOUT calling the LLM.
      // Only the caption/hashtags/date need actual language understanding.
      function clientSideFields(result) {
        var link = result.querySelector('a.gs-title[href], a[data-ctorig]');
        var url = link ? (link.getAttribute('data-ctorig') || link.href) : '';

        var out = { url: url, username: null, shortcode: null, platform: null };

        // Instagram: instagram.com/{username}/reel/{shortcode}/  OR
        //            instagram.com/reel/{shortcode}/
        var ig = url.match(/instagram\.com\/(?:([^\/]+)\/)?reel\/([^\/?#]+)/);
        if (ig) {
          out.platform = 'instagram';
          out.username = ig[1] && ig[1] !== 'reel' ? ig[1] : null;
          out.shortcode = ig[2];
        }
        // TikTok: tiktok.com/@{username}/video/{id}
        var tt = url.match(/tiktok\.com\/@([^\/?#]+)\/video\/(\d+)/);
        if (tt) {
          out.platform = 'tiktok';
          out.username = tt[1];
          out.shortcode = tt[2];
        }
        return out;
      }

      function getSnippet(result) {
        var el = result.querySelector('.gs-snippet, .gs-bidi-start-align.gs-snippet');
        var text = el ? (el.textContent || '').replace(/\s+/g, ' ').trim() : '';
        if (text.length > SNIPPET_MAX) text = text.slice(0, SNIPPET_MAX) + '…';
        return text;
      }

      function highlight(json) {
        return json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/("(\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
          function (match) {
            var cls = 'n';
            if (/^"/.test(match)) cls = /:$/.test(match) ? 'k' : 's';
            else if (/true|false|null/.test(match)) cls = 'n';
            return '<span class="' + cls + '">' + match + '</span>';
          });
      }

      function ensurePanel(result) {
        var panel = result.querySelector('.reel-json-panel');
        if (!panel) {
          panel = document.createElement('pre');
          panel.className = 'reel-json-panel';
          result.appendChild(panel);
        }
        return panel;
      }
      function renderPanel(result, obj) {
        ensurePanel(result).innerHTML = highlight(JSON.stringify(obj, null, 2));
      }
      function renderError(result, msg) {
        ensurePanel(result).innerHTML = '<span class="err">' + msg + '</span>';
      }

      async function extract(result, btn) {
        var apiKey = window.getApiKey();
        if (!apiKey) {
          renderError(result, 'No API key set. Paste one in the banner above.');
          return;
        }

        var base = clientSideFields(result);
        var snippet = getSnippet(result);

        // Cache hit? Re-render for free.
        var cache = loadCache();
        var cacheKey = base.url || snippet;
        if (cacheKey && cache[cacheKey]) {
          renderPanel(result, cache[cacheKey]);
          return;
        }

        // Nothing to send? Regex got everything we can get. Skip the LLM.
        if (!snippet) {
          var merged = Object.assign({ caption: null, hashtags: [], date: null }, base);
          if (cacheKey) { cache[cacheKey] = merged; saveCache(cache); }
          renderPanel(result, merged);
          return;
        }

        btn.disabled = true;
        var originalHtml = btn.innerHTML;
        btn.innerHTML = SVG_SPARK + '<span>Extracting…</span>';

        // Minimal prompt: just ask for the 3 fields we can't get client-side.
        var systemPrompt =
          'Extract from social-media snippet. Reply ONLY JSON: ' +
          '{"caption":string|null,"hashtags":string[],"date":string|null}. ' +
          'hashtags without #. date ISO 8601 or null.';

        try {
          var res = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + apiKey,
            },
            body: JSON.stringify({
              model: 'gpt-4o-mini',
              temperature: 0,
              max_tokens: 200,
              response_format: { type: 'json_object' },
              messages: [
                { role: 'system', content: systemPrompt },
                { role: 'user', content: snippet },
              ],
            }),
          });

          if (!res.ok) {
            var errBody = await res.text();
            renderError(result, 'OpenAI ' + res.status + ': ' + errBody.slice(0, 300));
            return;
          }

          var data = await res.json();
          var content = data.choices && data.choices[0] &&
                        data.choices[0].message && data.choices[0].message.content;
          if (!content) { renderError(result, 'Empty response.'); return; }

          var parsed;
          try { parsed = JSON.parse(content); }
          catch (e) {
            renderError(result, 'Model did not return JSON:\n' + content);
            return;
          }

          // Merge LLM output with client-side fields — LLM never touches
          // url/username/shortcode/platform.
          var merged = Object.assign({}, base, {
            caption:  parsed.caption  != null ? parsed.caption  : null,
            hashtags: Array.isArray(parsed.hashtags) ? parsed.hashtags : [],
            date:     parsed.date     != null ? parsed.date     : null,
          });

          // Cost telemetry, one-line, dev console only.
          if (data.usage) {
            console.log(
              '[extract] tokens: in=' + data.usage.prompt_tokens +
              ' out=' + data.usage.completion_tokens +
              ' ~ $' + (
                (data.usage.prompt_tokens * 0.15 +
                 data.usage.completion_tokens * 0.60) / 1e6
              ).toFixed(6)
            );
          }

          if (cacheKey) { cache[cacheKey] = merged; saveCache(cache); }
          renderPanel(result, merged);
        } catch (err) {
          renderError(result, 'Network error: ' + (err && err.message ? err.message : err));
        } finally {
          btn.disabled = false;
          btn.innerHTML = originalHtml;
        }
      }

      function addExtractButtons() {
        document.querySelectorAll('.gsc-webResult.gsc-result').forEach(function (result) {
          if (result.querySelector('.reel-extract-btn')) return;

          var btn = document.createElement('button');
          btn.className = 'reel-extract-btn';
          btn.type = 'button';
          btn.innerHTML = SVG_SPARK + '<span>Extract JSON</span>';

          btn.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            extract(result, btn);
          });

          result.appendChild(btn);
        });
      }

      var mo = new MutationObserver(addExtractButtons);
      mo.observe(document.body, { childList: true, subtree: true });
    })();
  </script>
</body>
</html>
